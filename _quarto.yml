project:
  type: website
  output-dir: _site
  # course/ and file/ are pre-existing, self-contained course sites/materials
  # (not part of this migration) -- restrict rendering to just this site's
  # own pages so Quarto doesn't try to interpret their own (non-Quarto)
  # front matter. They're still copied through as static resources.
  render:
    - "*.qmd"
    - "blog/**/*.qmd"

website:
  title: "Yujuan Zhang, PhD"
  site-url: "https://yujuan-zhang.github.io"
  description: "Bioinformatician and BioAI scientist"
  favicon: images/favicon/favicon.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: awards.qmd
        text: Awards
      - href: projects.qmd
        text: Projects
      - href: talks_pubs.qmd
        text: Publications
      - href: blog.qmd
        text: Blog
        icon: lightning-charge-fill
    right:
      - icon: github
        href: https://github.com/yujuan-zhang
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=CdA1HhMAAAAJ&hl=en
        aria-label: Google Scholar
      - icon: envelope
        href: mailto:yujuan.zhang418@gmail.com

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    grid:
      # No left sidebar is configured anywhere on this site (navigation is
      # all in the top navbar) -- sidebar-width previously reserved an
      # empty 250px gutter on the left of every page for a sidebar that
      # was never there, which is what was actually reading as "too much
      # left whitespace" on the about page.
      body-width: 900px
      margin-width: 250px
    # GoatCounter (privacy-friendly, free analytics) site-wide, not just
    # blog/. blog/_post-meta.html separately reads this same site's public
    # per-page counter endpoint to show a live view count under each post's
    # title.
    include-in-header:
      text: |
        <script data-goatcounter="https://yujuan-zhang.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
