# Applies to every post under blog/ -- comments + reading time enabled
# site-wide for the blog only (not Home/Awards/Projects/Publications).
# Comments values are from giscus.app after enabling Discussions +
# installing the giscus GitHub App on yujuan-zhang/yujuan-zhang.github.io.
filters:
  - _reading-time.lua
format:
  html:
    include-after-body: _post-meta.html
comments:
  giscus:
    repo: yujuan-zhang/yujuan-zhang.github.io
    repo-id: "R_kgDORF46Qw"
    category: "Announcements"
    category-id: "DIC_kwDORF46Q84DGVET"
    reactions-enabled: true
    loading: lazy
