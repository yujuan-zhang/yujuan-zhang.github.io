<script>
// Rebuilds the title-block metadata (date, reading time, comment count,
// categories) as a single plain-text line, matching the reference layout
// at https://divingintogeneticsandgenomics.com. Quarto's own title
// template renders these as separate elements (badge-style categories,
// a "Published" block, and our own .reading-time div from
// _reading-time.lua) that can't be reordered with CSS alone since they
// aren't DOM siblings -- so this reads their text back out, builds one
// line, and hides the originals.
(function () {
  var titleBlock = document.querySelector(".quarto-title");
  if (!titleBlock) return;

  var dateEl = document.querySelector(".quarto-title-meta-contents .date");
  var readingEl = document.querySelector(".reading-time");
  var catsEl = document.querySelector(".quarto-categories");

  var dateText = dateEl ? dateEl.textContent.trim() : "";
  var readingText = readingEl ? readingEl.textContent.trim() : "";
  var cats = catsEl
    ? Array.prototype.map.call(
        catsEl.querySelectorAll(".quarto-category"),
        function (c) {
          return c.textContent.trim();
        }
      )
    : [];

  var meta = document.createElement("div");
  meta.className = "post-meta-line";

  function addPart(node) {
    if (meta.childElementCount > 0) {
      var dot = document.createElement("span");
      dot.className = "post-meta-dot";
      dot.textContent = "·";
      meta.appendChild(dot);
    }
    meta.appendChild(node);
  }

  function textPart(text) {
    var span = document.createElement("span");
    span.textContent = text;
    return span;
  }

  if (dateText) addPart(textPart("Last updated on " + dateText));
  if (readingText) addPart(textPart(readingText));

  // Placeholder until (if) a real count arrives via giscus's postMessage
  // metadata below -- never a made-up number.
  var commentSpan = textPart("0 Comments");
  commentSpan.id = "post-comment-count";
  addPart(commentSpan);

  if (cats.length) {
    var catPart = document.createElement("span");
    var icon = document.createElement("i");
    icon.className = "bi bi-folder2 post-meta-folder-icon";
    catPart.appendChild(icon);
    catPart.appendChild(document.createTextNode(cats.join(", ")));
    addPart(catPart);
  }

  titleBlock.insertAdjacentElement("afterend", meta);

  // Share row -- the actual second line under the title, right below the
  // metadata line. Built from the live page URL/title (works the same on
  // localhost and the published site) rather than anything hand-typed.
  var h1 = titleBlock.querySelector("h1.title");
  var pageTitle = h1 ? h1.textContent.trim() : document.title;
  var pageUrl = window.location.href;
  var encodedUrl = encodeURIComponent(pageUrl);
  var encodedTitle = encodeURIComponent(pageTitle);

  var shareLinks = [
    {
      label: "Share on X",
      icon: "bi-twitter",
      href: "https://twitter.com/intent/tweet?url=" + encodedUrl + "&text=" + encodedTitle,
    },
    {
      label: "Share on Facebook",
      icon: "bi-facebook",
      href: "https://www.facebook.com/sharer/sharer.php?u=" + encodedUrl,
    },
    {
      label: "Share on LinkedIn",
      icon: "bi-linkedin",
      href: "https://www.linkedin.com/sharing/share-offsite/?url=" + encodedUrl,
    },
    {
      label: "Share on Weibo",
      icon: "bi-sina-weibo",
      href: "https://service.weibo.com/share/share.php?url=" + encodedUrl + "&title=" + encodedTitle,
    },
    {
      label: "Share by email",
      icon: "bi-envelope-fill",
      href: "mailto:?subject=" + encodedTitle + "&body=" + encodedUrl,
    },
  ];

  var shareRow = document.createElement("div");
  shareRow.className = "post-share-row";
  shareLinks.forEach(function (link) {
    var a = document.createElement("a");
    a.className = "post-share-icon";
    a.href = link.href;
    a.setAttribute("aria-label", link.label);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    var i = document.createElement("i");
    i.className = "bi " + link.icon;
    a.appendChild(i);
    shareRow.appendChild(a);
  });
  // Copy-link is an action, not a navigation, so it's a real <button>
  // rather than an <a> styled to look like one.
  var copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "post-share-icon";
  copyBtn.setAttribute("aria-label", "Copy link");
  var copyIcon = document.createElement("i");
  copyIcon.className = "bi bi-link-45deg";
  copyBtn.appendChild(copyIcon);
  copyBtn.addEventListener("click", function () {
    navigator.clipboard.writeText(pageUrl).then(function () {
      copyIcon.className = "bi bi-clipboard-check-fill";
      copyBtn.classList.add("post-share-copied");
      setTimeout(function () {
        copyIcon.className = "bi bi-link-45deg";
        copyBtn.classList.remove("post-share-copied");
      }, 1500);
    });
  });
  shareRow.appendChild(copyBtn);

  meta.insertAdjacentElement("afterend", shareRow);

  if (catsEl) catsEl.style.display = "none";
  var titleMeta = document.querySelector(".quarto-title-meta");
  if (titleMeta) titleMeta.style.display = "none";
  if (readingEl) readingEl.style.display = "none";

  // Ask giscus's loader (appended earlier in the page by Quarto's own
  // comments integration) to emit a postMessage with the discussion's
  // real comment count once its iframe loads, instead of hand-coding a
  // number that would go stale.
  var giscusScript = document.querySelector(
    'script[src="https://giscus.app/client.js"]'
  );
  if (giscusScript) giscusScript.dataset.emitMetadata = "1";

  window.addEventListener("message", function (event) {
    if (event.origin !== "https://giscus.app") return;
    if (!event.data || !event.data.giscus) return;
    var discussion = event.data.giscus.discussion;
    var n = discussion ? discussion.totalCommentCount : 0;
    commentSpan.textContent = n + (n === 1 ? " Comment" : " Comments");
  });
})();
</script>
