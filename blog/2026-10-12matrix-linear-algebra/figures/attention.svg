<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img"><title>Attention weights from a three-position example</title><rect width="1100" height="520" rx="18" fill="#f3f7fb"/><g font-family="Arial,sans-serif"><text x="35" y="49" font-size="29" fill="#17354c">Attention weights from a three-position example</text><text x="35" y="85" font-size="17" fill="#17354c">Rows: querying position. Columns: position supplying information.</text><text x="336" y="140" font-size="19" fill="#17354c">Position 1</text><text x="526" y="140" font-size="19" fill="#17354c">Position 2</text><text x="716" y="140" font-size="19" fill="#17354c">Position 3</text><text x="95" y="213" font-size="20" fill="#17354c">Position 1</text><rect x="300" y="163" width="174" height="73" rx="8" fill="rgb(189,204,211)"/><text x="348" y="207" font-size="23" fill="#17354c">0.289</text><rect x="490" y="163" width="174" height="73" rx="8" fill="rgb(174,189,196)"/><text x="538" y="207" font-size="23" fill="#17354c">0.393</text><rect x="680" y="163" width="174" height="73" rx="8" fill="rgb(185,200,207)"/><text x="728" y="207" font-size="23" fill="#17354c">0.318</text><text x="880" y="213" font-size="19" fill="#17354c">Σ = 1.000</text><text x="95" y="298" font-size="20" fill="#17354c">Position 2</text><rect x="300" y="248" width="174" height="73" rx="8" fill="rgb(167,182,189)"/><text x="348" y="292" font-size="23" fill="#17354c">0.446</text><rect x="490" y="248" width="174" height="73" rx="8" fill="rgb(204,219,226)"/><text x="538" y="292" font-size="23" fill="#17354c">0.179</text><rect x="680" y="248" width="174" height="73" rx="8" fill="rgb(177,192,199)"/><text x="728" y="292" font-size="23" fill="#17354c">0.375</text><text x="880" y="298" font-size="19" fill="#17354c">Σ = 1.000</text><text x="95" y="383" font-size="20" fill="#17354c">Position 3</text><rect x="300" y="333" width="174" height="73" rx="8" fill="rgb(180,195,202)"/><text x="348" y="377" font-size="23" fill="#17354c">0.357</text><rect x="490" y="333" width="174" height="73" rx="8" fill="rgb(192,207,214)"/><text x="538" y="377" font-size="23" fill="#17354c">0.267</text><rect x="680" y="333" width="174" height="73" rx="8" fill="rgb(177,192,199)"/><text x="728" y="377" font-size="23" fill="#17354c">0.376</text><text x="880" y="383" font-size="19" fill="#17354c">Σ = 1.000</text><text x="70" y="463" font-size="20" fill="#17354c">Computed with NumPy • seed 42 • random, untrained projections</text><text x="70" y="500" font-size="16" fill="#17354c">Row sums use full precision; displayed entries are rounded.</text></g></svg>