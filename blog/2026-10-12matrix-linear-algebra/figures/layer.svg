<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img"><title>A layer changes the feature space</title><rect width="1100" height="420" rx="18" fill="#f3f7fb"/><g font-family="Arial,sans-serif"><text x="35" y="49" font-size="29" fill="#17354c">A layer changes the feature space</text><text x="35" y="85" font-size="17" fill="#17354c">X @ W + b  →  activation  →  H</text><rect x="50" y="145" width="260" height="130" rx="13" fill="#d9eceb"/><text x="72" y="184" font-size="22" fill="#17354c">INPUT X</text><text x="72" y="224" font-size="19" fill="#17354c">5 samples × 4 features</text><rect x="405" y="145" width="260" height="130" rx="13" fill="#fae2c6"/><text x="427" y="184" font-size="22" fill="#17354c">WEIGHTS W</text><text x="427" y="224" font-size="19" fill="#17354c">4 inputs × 3 outputs</text><rect x="760" y="145" width="290" height="130" rx="13" fill="#d9e5fa"/><text x="782" y="184" font-size="22" fill="#17354c">OUTPUT H</text><text x="782" y="224" font-size="19" fill="#17354c">5 samples × 3 features</text><text x="340" y="222" font-size="34" fill="#17354c">@</text><text x="698" y="222" font-size="34" fill="#17354c">→</text><text x="60" y="335" font-size="23" fill="#17354c">The inner dimensions match: (5, 4) @ (4, 3) → (5, 3)</text><text x="60" y="382" font-size="19" fill="#17354c">Bias has 3 entries and is added to every row before activation.</text></g></svg>