18" font-weight="700" fill="#15354d">80%</text><rect x="572" y="282.0" width="67" height="168.0" rx="3" fill="#087f83"/><text x="571" y="272.0" font-size="18" font-weight="700" fill="#15354d">60%</text><text x="472" y="485" font-size="19" font-weight="700" fill="#15354d">Difficult cases</text><text x="490" y="513" font-size="16" font-weight="400" fill="#15354d">n = 100</text><rect x="780" y="188.2" width="67" height="261.8" rx="3" fill="#5b7185"/><text x="779" y="178.2" font-size="18" font-weight="700" fill="#15354d">93.5%</text><rect x="872" y="186.24" width="67" height="263.76" rx="3" fill="#087f83"/><text x="871" y="176.24" font-size="18" font-weight="700" fill="#15354d">94.2%</text><text x="772" y="485" font-size="19" font-weight="700" fill="#15354d">All cases</text><text x="790" y="513" font-size="16" font-weight="400" fill="#15354d">n = 1000</text><rect x="690" y="112" width="20" height="15" rx="2" fill="#5b7185"/><text x="718" y="126" font-size="16" font-weight="400" fill="#15354d">Model A</text><rect x="832" y="112" width="20" height="15" rx="2" fill="#087f83"/><text x="860" y="126" font-size="16" font-weight="400" fill="#15354d">Model B</text><text x="80" y="565" font-size="22" font-weight="700" fill="#15354d">Overall: +0.7 percentage points. Difficult cases: −20 points.</text></g></svg>