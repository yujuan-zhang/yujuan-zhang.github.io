<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img"><title>The prediction changes the next training set</title><rect width="1100" height="580" rx="20" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="38" y="50" font-size="29" font-weight="700" fill="#15354d">The prediction changes the next training set</text><text x="38" y="83" font-size="17" font-weight="400" fill="#15354d">A recommender observes responses to what it chose to show.</text><rect x="70" y="150" width="410" height="105" rx="10" fill="#deecef"/><text x="92" y="190" font-size="23" font-weight="700" fill="#15354d">1. Model scores items</text><text x="92" y="225" font-size="17" font-weight="400" fill="#15354d">Uses current training data</text><rect x="620" y="150" width="410" height="105" rx="10" fill="#deecef"/><text x="642" y="190" font-size="23" font-weight="700" fill="#15354d">2. Exposure policy</text><text x="642" y="225" font-size="17" font-weight="400" fill="#15354d">Chooses what is displayed</text><rect x="620" y="350" width="410" height="105" rx="10" fill="#deecef"/><text x="642" y="390" font-size="23" font-weight="700" fill="#15354d">3. Observed responses</text><text x="642" y="425" font-size="17" font-weight="400" fill="#15354d">Clicks on exposed items</text><rect x="70" y="350" width="410" height="105" rx="10" fill="#deecef"/><text x="92" y="390" font-size="23" font-weight="700" fill="#15354d">4. Updated training data</text><text x="92" y="425" font-size="17" font-weight="400" fill="#15354d">Reflects the previous policy</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker></defs><path d="M490 202 L605 202" fill="none" stroke="#087f83" stroke-width="4" marker-end="url(#arrow)"/><path d="M825 270 L825 335" fill="none" stroke="#087f83" stroke-width="4" marker-end="url(#arrow)"/><path d="M605 403 L490 403" fill="none" stroke="#087f83" stroke-width="4" marker-end="url(#arrow)"/><path d="M275 335 L275 270" fill="none" stroke="#087f83" stroke-width="4" marker-end="url(#arrow)"/><text x="75" y="521" font-size="22" font-weight="700" fill="#15354d">Not shown ≠ disliked. Missing exposure means missing evidence.</text><text x="75" y="554" font-size="16" font-weight="400" fill="#15354d">Conceptual diagram • no causal effect is estimated here</text></g></svg>