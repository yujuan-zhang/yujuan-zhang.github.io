<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img"><title>Split the unit you want to generalize to</title><rect width="1100" height="420" fill="#f4f7fb"/><g font-family="Arial, sans-serif"><text x="42" y="52" font-size="29" font-weight="bold" fill="#15324f">Split the unit you want to generalize to</text><text x="42" y="85" font-size="17" fill="#52677c">A / B / C / D represent different patients; each has two observations.</text><rect x="42" y="125" width="490" height="110" rx="12" fill="#ffe0db"/><text x="60" y="154" font-size="18" fill="#15324f">ROW SPLIT</text><text x="60" y="180" font-size="18" fill="#15324f">Train: A1  B1  C1  D1</text><text x="60" y="206" font-size="18" fill="#15324f">Test:   A2  B2  C2  D2</text><rect x="568" y="125" width="490" height="110" rx="12" fill="#dcefeb"/><text x="586" y="154" font-size="18" fill="#15324f">PATIENT SPLIT</text><text x="586" y="180" font-size="18" fill="#15324f">Train: A1  A2  B1  B2</text><text x="586" y="206" font-size="18" fill="#15324f">Test:   C1  C2  D1  D2</text><rect x="42" y="280" width="1016" height="100" rx="12" fill="#e2e9f5"/><text x="60" y="309" font-size="18" fill="#15324f">Left: all four patients appear in both partitions.</text><text x="60" y="335" font-size="18" fill="#15324f">Right: no patient overlaps. Center and batch still need separate checks.</text></g></svg>