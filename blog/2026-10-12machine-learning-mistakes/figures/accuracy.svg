<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img"><title>99% accuracy. Zero positives found.</title><rect width="1100" height="470" fill="#f4f7fb"/><g font-family="Arial, sans-serif"><text x="42" y="52" font-size="29" font-weight="bold" fill="#15324f">99% accuracy. Zero positives found.</text><text x="42" y="85" font-size="17" fill="#52677c">Constructed example: 1,000 samples; 10 positive, 990 negative.</text><rect x="42" y="125" width="490" height="160" rx="12" fill="#ffe0db"/><text x="60" y="154" font-size="18" fill="#15324f">MODEL A: predict everyone negative</text><text x="60" y="180" font-size="18" fill="#15324f">TP = 0      FN = 10</text><text x="60" y="206" font-size="18" fill="#15324f">FP = 0      TN = 990</text><text x="60" y="232" font-size="18" fill="#15324f">Accuracy = 99%  |  Recall = 0%</text><rect x="568" y="125" width="490" height="160" rx="12" fill="#dcefeb"/><text x="586" y="154" font-size="18" fill="#15324f">MODEL B: detect 8 positives</text><text x="586" y="180" font-size="18" fill="#15324f">TP = 8      FN = 2</text><text x="586" y="206" font-size="18" fill="#15324f">FP = 40    TN = 950</text><text x="586" y="232" font-size="18" fill="#15324f">Accuracy = 95.8%  |  Recall = 80%</text><rect x="42" y="325" width="1016" height="80" rx="12" fill="#e2e9f5"/><text x="60" y="354" font-size="18" fill="#15324f">Model B precision = 8 / 48 = 16.7%.</text><text x="60" y="380" font-size="18" fill="#15324f">A higher recall comes with false positives. State the intended trade-off.</text></g></svg>